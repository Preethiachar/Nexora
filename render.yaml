databases:
  - name: nexora-db
    databaseName: nexora
    user: nexora_user
    plan: free

services:
  - type: web
    name: nexora-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nexora-db
          property: connectionString
      - key: REDIS_URL
        value: ""
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: PYTHON_VERSION
        value: "3.11.0"

  - type: web
    name: nexora-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nexora-backend-to0k.onrender.com
